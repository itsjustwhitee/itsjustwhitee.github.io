    <script src="../components.js"></script>

    <style>
        /* ── PARALLAX ORBS ─────────────────────────────────────────── */
        .parallax-orb {
            position: fixed; border-radius: 50%;
            pointer-events: none; z-index: 0;
            filter: blur(90px); will-change: transform;
        }
    </style>
</head>
<body data-page="bento">

    <!-- PARALLAX ORBS -->
    <div id="orb1" class="parallax-orb" style="width:550px;height:550px;background:radial-gradient(circle,rgba(0,187,201,0.06) 0%,transparent 70%);top:-80px;right:-80px;"></div>
    <div id="orb2" class="parallax-orb" style="width:420px;height:420px;background:radial-gradient(circle,rgba(9,79,79,0.1) 0%,transparent 70%);bottom:30%;left:-80px;"></div>

    <!-- NAV -->
    <nav id="site-nav" class="site-nav" data-active="bento"></nav>

    <div class="container" style="padding-top: 100px;">

        <header class="profile-header">
            <img src="../assets/propic.webp" alt="Matteo Fontolan" class="profile-pic"
                 style="opacity:0;animation:fadeUp 0.6s ease 0.1s forwards;">
            <p class="header-label" data-i18n="bento.header_label"
               style="opacity:0;animation:fadeUp 0.6s ease 0.25s forwards;">// justwhitee's bento</p>
            <h1 style="opacity:0;animation:fadeUp 0.7s ease 0.4s forwards;">Matteo <span>Fontolan</span></h1>
            <p class="bio" data-i18n-html="bento.bio"
               style="opacity:0;animation:fadeUp 0.7s ease 0.55s forwards;">Tech enthusiast 👾 | Computer Engineering (M.Sc. WIP) 🧑‍💻 | Foodie 🍣 | Caricature &amp; Graphic Design for hobby 🖱️</p>
            <p class="cta" data-i18n="bento.cta"
               style="opacity:0;animation:fadeUp 0.7s ease 0.7s forwards;">So, how can I help you? 😁 Feel free to ask! 💡</p>
        </header>

        <main class="bento-grid" id="bento-grid"></main>

        <footer id="site-footer" class="site-footer" data-footer="full" data-copy-key="bento.footer_copy"></footer>

    </div>
    <script src="script.js"></script>
    <script>
    // ── MOUSE PARALLAX ORBS ───────────────────────────────────────────────
    const _orb1 = document.getElementById('orb1');
    const _orb2 = document.getElementById('orb2');
    let _ticking = false;
    window.addEventListener('mousemove', e => {
        if (_ticking) return; _ticking = true;
        requestAnimationFrame(() => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            if (_orb1) _orb1.style.transform = `translate(${x * 30}px, ${y * 30}px)`;
            if (_orb2) _orb2.style.transform = `translate(${-x * 20}px, ${-y * 20}px)`;
            _ticking = false;
        });
    }, { passive: true });
    </script>
</body>
