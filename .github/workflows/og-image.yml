name: Auto-update OG image

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'shared.css'
      - 'i18n.js'
      - 'components.js'
      - 'assets/logo.svg'
      - 'assets/propic.webp'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: og-image
  cancel-in-progress: true

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright (Chromium)
        run: npx --yes playwright install --with-deps chromium

      - name: Serve site
        run: python3 -m http.server 8080 &

      - name: Wait for server
        run: npx --yes wait-on http://localhost:8080/index.html

      - name: Capture homepage hero as OG image
        run: >
          npx --yes playwright screenshot
          --viewport-size=1200,630
          --lang=en-US
          --wait-for-timeout=1500
          http://localhost:8080/index.html
          assets/og-image.jpg

      - name: Commit updated image if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/og-image.jpg
          git diff --cached --quiet || git commit -m "chore: :framed_picture: Auto-update og-image.jpg [skip ci]"
          git push
